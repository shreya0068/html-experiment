<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Types of HTML Lists</title>
</head>
<body>

    <h1>Different Types of HTML Lists</h1>

    <h2>1. Ordered List</h2>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ol>

    <h2>2. Unordered List</h2>

    <ul>
        <li>Google Chrome</li>
        <li>Visual Studio Code</li>
        <li>Git</li>
        <li>GitHub</li>
    </ul>

    <h2>3. Description List</h2>

    <dl>
        <dt>HTML</dt>
        <dd>Used to structure webpages.</dd>

        <dt>CSS</dt>
        <dd>Used to style webpages.</dd>

        <dt>JavaScript</dt>
        <dd>Used to add interactivity.</dd>
    </dl>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Fundamentals</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            color: #333333;
            font-size: 18px;
            line-height: 1.5;
        }

        .container {
            background-color: white;
            border: 2px solid #2874c7;
            padding: 20px;
            margin: 30px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to CSS</h1>

        <p>
            CSS stands for Cascading Style Sheets.
            It is used to style HTML webpages.
        </p>

        <p>
            CSS makes webpages attractive by
            changing colours, fonts and layouts.
        </p>

        <button>Learn More</button>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <title>Student Marks Table</title>

            </tr>

            <tr>
                <td>102</td>
                <td>Rahul</td>
                <td>CSS</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Priya</td>
                <td>JavaScript</td>
                <td>88</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Total Marks</th>
                <td>263</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>

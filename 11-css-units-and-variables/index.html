<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Units and Variables</title>

    <style>
        :root {
            --primary-color: navy;
            --background-color: #f0f4f8;
            --spacing: 20px;
        }

        body {
            background-color: var(--background-color);
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            padding: var(--spacing);
            background-color: white;
            border: 2px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            font-size: 2rem;
            text-align: center;
        }

        p {
            font-size: 18px;
            margin: 10px;
        }

        .box {
            width: 50vw;
            height: 100px;
            background-color: lightblue;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Units and Variables</h1>

        <p>
            CSS units define the size and spacing
            of webpage elements.
        </p>

        <div class="box">
            This box uses viewport width (vw).
        </div>

    </div>

</body>
</html>
